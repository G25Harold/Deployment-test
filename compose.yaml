services:
  backend:
    build:
      context: .
      dockerfile: Server/Dockerfile

    ports:
      - "5000:5000"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000

    restart: unless-stopped

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile

    ports:
      - "8080:3100"

    environment:
      NODE_ENV: production
      PORT: 3100

    depends_on:
      - backend

    restart: unless-stopped