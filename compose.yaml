services:
  backend:
    build:
      context: .
      dockerfile: Server/Dockerfile
    ports:
      - "5000:5000"
      - "7055:7055"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:7055;http://+:5000

  client:
    build:
      context: .
      dockerfile: Client/Dockerfile
    ports:
      - "8080:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
    depends_on:
      - backend
